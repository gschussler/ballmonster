<div class="offense">
  <!-- Left Side -->
  <div class="selectable-o">
    <!-- Type Buttons -->
    <div class="type-panel" role="group">
      <h3 id="type-panel-label">Choose Type - <i>Attacking</i></h3>
      <div class="types-header">
        <div class="display-types">
          <span id="type1" aria-hidden="true">
            <button class="display-type normal">
              <svg class="icon">
                <use href="/svg/types-min.svg#normal"></use>
              </svg>
              Normal
            </button>
            <svg class="toggle-icon" aria-hidden="true">
              <use href="/svg/icons.svg#arrowdown"></use>
            </svg>
          </span>
          <span></span> <!-- placeholder -->
        </div>
      </div>
      <div class="panel-well">
        <details id="details-primary" class="type-dropdown">
          <summary hidden></summary>
          <div class="button-grid">
            <button class="normal" data-type="normal">
              <svg class="icon">
                <use href="/svg/types-min.svg#normal"></use>
              </svg>
              Normal
            </button>
            <button class="fire" data-type="fire">
              <svg class="icon">
                <use href="/svg/types-min.svg#fire"></use>
              </svg>
              Fire
            </button>
            <button class="water" data-type="water">
              <svg class="icon">
                <use href="/svg/types-min.svg#water"></use>
              </svg>
              Water
            </button>
            <button class="electric" data-type="electric">
              <svg class="icon">
                <use href="/svg/types-min.svg#electric"></use>
              </svg>
              Electric
            </button>
            <button class="grass" data-type="grass">
              <svg class="icon">
                <use href="/svg/types-min.svg#grass"></use>
              </svg>
              Grass
            </button>
            <button class="ice" data-type="ice">
              <svg class="icon">
                <use href="/svg/types-min.svg#ice"></use>
              </svg>
              Ice
            </button>
            <button class="fighting" data-type="fighting">
              <svg class="icon">
                <use href="/svg/types-min.svg#fighting"></use>
              </svg>
              Fighting
            </button>
            <button class="poison" data-type="poison">
              <svg class="icon">
                <use href="/svg/types-min.svg#poison"></use>
              </svg>
              Poison
            </button>
            <button class="ground" data-type="ground">
              <svg class="icon">
                <use href="/svg/types-min.svg#ground"></use>
              </svg>
              Ground
            </button>
            <button class="flying" data-type="flying">
              <svg class="icon">
                <use href="/svg/types-min.svg#flying"></use>
              </svg>
              Flying
            </button>
            <button class="psychic" data-type="psychic">
              <svg class="icon">
                <use href="/svg/types-min.svg#psychic"></use>
              </svg>
              Psychic
            </button>
            <button class="bug" data-type="bug">
              <svg class="icon">
                <use href="/svg/types-min.svg#bug"></use>
              </svg>
              Bug
            </button>
            <button class="rock" data-type="rock">
              <svg class="icon">
                <use href="/svg/types-min.svg#rock"></use>
              </svg>
              Rock
            </button>
            <button class="ghost" data-type="ghost">
              <svg class="icon">
                <use href="/svg/types-min.svg#ghost"></use>
              </svg>
              Ghost
            </button>
            <button class="dragon" data-type="dragon">
              <svg class="icon">
                <use href="/svg/types-min.svg#dragon"></use>
              </svg>
              Dragon
            </button>
            <button class="dark" data-type="dark">
              <svg class="icon">
                <use href="/svg/types-min.svg#dark"></use>
              </svg>
              Dark
            </button>
            <button class="steel" data-type="steel">
              <svg class="icon">
                <use href="/svg/types-min.svg#steel"></use>
              </svg>
              Steel
            </button>
            <button class="fairy" data-type="fairy">
              <svg class="icon">
                <use href="/svg/types-min.svg#fairy"></use>
              </svg>
              Fairy
            </button>
          </div>
        </details>
      </div>
    </div>
    <!-- Exceptions to Type Effectivity -->
    <div class="exceptions-o">
      <!-- Special Moves -->
      <div class="special-moves-o" role="group" aria-labelledby="special-moves-label">
        <h3 id="special-moves-label">Choose special move</h3>
        <div class="move-grid" >
          <button type="button" data-move="flying-press" data-type="fighting">
            Flying Press
          </button>
          <button type="button" data-move="freeze-dry" data-type="ice">
            Freeze-Dry
          </button>
          <button type="button" data-move="thousand-arrows" data-type="ground">
            Thousand Arrows
          </button>
        </div>
      </div>
      <!-- Special Effects -->
      <div class="select-container-o">
        <div class="special-effects">
          <h3>Choose ability</h3>
          <label for="atk-ability-select" class="visuallyhidden">Choose ability</label>
          <select id="atk-ability-select" name="atk-ability" class="abilities">
            <option value="">None</option>
            <option value="flash-fire-atk">Flash Fire</option>
            <option value="scrappy">Scrappy</option>
            <option value="tinted-lens">Tinted Lens</option>
            <option value="water-bubble-atk">Water Bubble</option>
          </select>
        </div>
      </div>
    </div>
    <div class="selectable-extra">
      <div class="selectable-extra-buttons">
        <button id="reset-button" class="reset-button">Reset</button>
        <button id="copy-button" class="copy-button">Copy Link</button>
      </div>
    </div>
  </div>

  <!-- Right Side: Effectiveness Results -->
  <div class="effectiveness-results">
    <div class="result-groups"></div>
  </div>
</div>
